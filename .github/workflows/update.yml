name: update-profile
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/gen.py"]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "pedro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add assets/fetch.svg README.md
          git diff --cached --quiet || (git commit -m "chore: refresh fetch" && git push)
